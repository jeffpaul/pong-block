# WordPress Plugin Release Workflow
# Builds to stable branch when main is updated

name: WordPress Plugin Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Clean for release
        run: |
          # Remove files/directories listed in .distignore
          if [ -f .distignore ]; then
            echo "Removing files based on .distignore..."
            
            while IFS= read -r line; do
              # Skip empty lines and comments
              if [[ -n "$line" && ! "$line" =~ ^[[:space:]]*# ]]; then
                line=$(echo "$line" | xargs)
                
                if [ -n "$line" ]; then
                  # Security validation: prevent directory traversal and absolute paths
                  if [[ "$line" == /* ]]; then
                    echo "Warning: Skipping absolute path: $line"
                    continue
                  fi
                  
                  if [[ "$line" == *../* ]] || [[ "$line" == *..*/ ]] || [[ "$line" == */../* ]] || [[ "$line" == ..* ]]; then
                    echo "Warning: Skipping directory traversal path: $line"
                    continue
                  fi
                  
                  # Only allow safe relative paths (no leading hyphens to prevent flag injection)
                  if [[ "$line" =~ ^[a-zA-Z0-9._/][a-zA-Z0-9._/-]*$ ]]; then
                    if [ -e "./$line" ]; then
                      echo "Removing: $line"
                      rm -rf "./$line" || echo "Failed to remove: $line"
                    else
                      echo "Skipping (not found): $line"
                    fi
                  else
                    echo "Warning: Skipping path with invalid characters: $line"
                  fi
                fi
              fi
            done < .distignore
            
            rm -f .distignore
          fi

      - name: Deploy to stable and WordPress.org
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit cleaned build
          git add -A
          
          # Check if there are any changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit after build and cleanup"
            git commit --allow-empty -m "Build (no changes): ${{ github.event.head_commit.message }}"
          else
            echo "Committing build changes"
            git commit -m "Build: ${{ github.event.head_commit.message }}"
          fi
          
          # Push to stable branch safely
          if git ls-remote --heads origin stable | grep -q stable; then
            echo "Stable branch exists, switching to it"
            git fetch origin stable
            git checkout stable
            
            # Attempt merge and detect conflicts
            if git merge --no-ff main -m "Merge main into stable: ${{ github.event.head_commit.message }}"; then
              echo "Clean merge completed successfully"
            else
              echo "Merge conflicts detected. This is expected for build artifacts."
              echo "Resolving conflicts by using main branch version (built artifacts)..."
              
              # Show what files have conflicts for transparency
              echo "Conflicted files:"
              git diff --name-only --diff-filter=U || true
              
              # Resolve by taking main's version, but be explicit about it
              git checkout --theirs .
              git add .
              git commit --no-edit
              echo "Conflicts resolved in favor of main branch (built version)"
            fi
          else
            echo "Creating new stable branch"
            git checkout -b stable
          fi
          
          # Push the stable branch
          git push origin stable

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: pong-block