# WordPress Plugin Release Workflow
# Builds to stable branch when main is updated

name: WordPress Plugin Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Clean for release
        run: |
          # Remove files/directories listed in .distignore
          if [ -f .distignore ]; then
            echo "Removing files based on .distignore..."
            
            while IFS= read -r line; do
              # Skip empty lines and comments
              if [[ -n "$line" && ! "$line" =~ ^[[:space:]]*# ]]; then
                line=$(echo "$line" | xargs)
                
                if [ -n "$line" ]; then
                  # Security validation: prevent directory traversal and absolute paths
                  if [[ "$line" == /* ]]; then
                    echo "Warning: Skipping absolute path: $line"
                    continue
                  fi
                  
                  if [[ "$line" == *../* ]] || [[ "$line" == *..* ]]; then
                    echo "Warning: Skipping directory traversal path: $line"
                    continue
                  fi
                  
                  # Only allow safe relative paths
                  if [[ "$line" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
                    echo "Removing: $line"
                    rm -rf "./$line" 2>/dev/null || true
                  else
                    echo "Warning: Skipping path with invalid characters: $line"
                  fi
                fi
              fi
            done < .distignore
            
            rm -f .distignore
          fi

      - name: Deploy to stable and WordPress.org
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit cleaned build
          git add -A
          git commit -m "${{ github.event.head_commit.message }}"
          
          # Push to stable branch
          git checkout -B stable
          git push origin stable --force

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: pong-block